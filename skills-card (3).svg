<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 290" width="800" height="290" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
text{font-family:'Fira Code',Consolas,monospace;text-anchor:middle}
.h{font-size:11px;letter-spacing:3px;fill:#64748b}
.t{font-size:15px;font-weight:700;fill:#e2e8f0}
.s{font-size:10.5px;fill:#94a3b8}
.card{fill:#0b1220;stroke:#1e3a8a;stroke-width:1.2}
.blue{fill:#3b82f6}.cy{fill:#22d3ee}
/* ML */
.reg{stroke:#22d3ee;stroke-width:2.5;fill:none;stroke-linecap:round;stroke-dasharray:110;stroke-dashoffset:110;animation:draw 3.5s ease-in-out infinite}
.pt{fill:#60a5fa;animation:pop 3.5s ease-in-out infinite}
@keyframes draw{0%{stroke-dashoffset:110}60%,100%{stroke-dashoffset:0}}
@keyframes pop{0%,100%{opacity:.35}50%{opacity:1}}
/* Agentic */
.orbit{animation:spin 8s linear infinite}
.ring{fill:none;stroke:#1e40af;stroke-width:1;stroke-dasharray:3 5}
.link{stroke:#3b82f6;stroke-width:1.2;opacity:.6}
.core{fill:#2563eb;animation:beat 2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.2)}}
/* GenAI */
.sp{transform-box:fill-box;transform-origin:center;animation:tw 2.4s ease-in-out infinite}
@keyframes tw{0%,100%{transform:scale(.6) rotate(0);opacity:.5}50%{transform:scale(1) rotate(45deg);opacity:1}}
/* Problem solving */
.e{stroke:#1e40af;stroke-width:1.5}
.nd{fill:#0b1220;stroke:#60a5fa;stroke-width:2;animation:visit 4.2s ease-in-out infinite}
@keyframes visit{0%{fill:#0b1220}4%,16%{fill:#22d3ee}26%,100%{fill:#0b1220}}
</style>

<text class="h" x="400" y="24">WHAT I BUILD &amp; SOLVE</text>

<!-- ML -->
<rect class="card" x="20" y="40" width="180" height="230" rx="14"/>
<g transform="translate(110,115)">
  <path class="reg" d="M-50,28 L50,-34"/>
  <circle class="pt" cx="-44" cy="20" r="3.5" style="animation-delay:0s"/>
  <circle class="pt" cx="-28" cy="24" r="3.5" style="animation-delay:.3s"/>
  <circle class="pt" cx="-12" cy="2" r="3.5" style="animation-delay:.6s"/>
  <circle class="pt" cx="4" cy="8" r="3.5" style="animation-delay:.9s"/>
  <circle class="pt" cx="20" cy="-16" r="3.5" style="animation-delay:1.2s"/>
  <circle class="pt" cx="34" cy="-14" r="3.5" style="animation-delay:1.5s"/>
  <circle class="pt" cx="46" cy="-38" r="3.5" style="animation-delay:1.8s"/>
</g>
<text class="t" x="110" y="190">Machine Learning</text>
<text class="s" x="110" y="212">Supervised · Deep Learning</text>
<text class="s" x="110" y="230">scikit-learn</text>
<text class="s" x="110" y="248">TensorFlow</text>

<!-- Agentic AI -->
<rect class="card" x="210" y="40" width="180" height="230" rx="14"/>
<g transform="translate(300,115)">
  <circle class="ring" r="38"/>
  <g class="orbit">
    <line class="link" x1="0" y1="0" x2="38" y2="0"/>
    <line class="link" x1="0" y1="0" x2="-19" y2="32.9"/>
    <line class="link" x1="0" y1="0" x2="-19" y2="-32.9"/>
    <circle class="cy" cx="38" cy="0" r="6"/>
    <circle class="blue" cx="-19" cy="32.9" r="6"/>
    <circle class="cy" cx="-19" cy="-32.9" r="6"/>
  </g>
  <circle class="core" r="11"/>
</g>
<text class="t" x="300" y="190">Agentic AI</text>
<text class="s" x="300" y="212">LangGraph · LangChain</text>
<text class="s" x="300" y="230">Tool Use · Multi-Agent</text>
<text class="s" x="300" y="248">Autonomous Workflows</text>

<!-- GenAI -->
<rect class="card" x="400" y="40" width="180" height="230" rx="14"/>
<g transform="translate(490,115)">
  <path class="sp cy" d="M0,-30 Q4,-4 30,0 Q4,4 0,30 Q-4,4 -30,0 Q-4,-4 0,-30Z"/>
  <path class="sp blue" style="animation-delay:.8s" transform="translate(-34,-26) scale(.45)" d="M0,-30 Q4,-4 30,0 Q4,4 0,30 Q-4,4 -30,0 Q-4,-4 0,-30Z"/>
  <path class="sp blue" style="animation-delay:1.4s" transform="translate(36,24) scale(.5)" d="M0,-30 Q4,-4 30,0 Q4,4 0,30 Q-4,4 -30,0 Q-4,-4 0,-30Z"/>
  <path class="sp cy" style="animation-delay:.4s" transform="translate(34,-32) scale(.3)" d="M0,-30 Q4,-4 30,0 Q4,4 0,30 Q-4,4 -30,0 Q-4,-4 0,-30Z"/>
</g>
<text class="t" x="490" y="190">Generative AI</text>
<text class="s" x="490" y="212">LLMs · RAG</text>
<text class="s" x="490" y="230">Prompt Engineering</text>
<text class="s" x="490" y="248">Vector Search</text>

<!-- Problem solving -->
<rect class="card" x="590" y="40" width="180" height="230" rx="14"/>
<g transform="translate(680,112)">
  <line class="e" x1="0" y1="-32" x2="-26" y2="0"/><line class="e" x1="0" y1="-32" x2="26" y2="0"/>
  <line class="e" x1="-26" y1="0" x2="-42" y2="32"/><line class="e" x1="-26" y1="0" x2="-10" y2="32"/>
  <line class="e" x1="26" y1="0" x2="10" y2="32"/><line class="e" x1="26" y1="0" x2="42" y2="32"/>
  <circle class="nd" cx="0" cy="-32" r="7" style="animation-delay:0s"/>
  <circle class="nd" cx="-26" cy="0" r="7" style="animation-delay:.6s"/>
  <circle class="nd" cx="-42" cy="32" r="7" style="animation-delay:1.2s"/>
  <circle class="nd" cx="-10" cy="32" r="7" style="animation-delay:1.8s"/>
  <circle class="nd" cx="26" cy="0" r="7" style="animation-delay:2.4s"/>
  <circle class="nd" cx="10" cy="32" r="7" style="animation-delay:3s"/>
  <circle class="nd" cx="42" cy="32" r="7" style="animation-delay:3.6s"/>
</g>
<text class="t" x="680" y="190">Problem Solving</text>
<text class="s" x="680" y="212">DSA · Algorithms</text>
<text class="s" x="680" y="230">Competitive Programming</text>
<text class="s" x="680" y="248">C++</text>
</svg>
